<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="400" fill="#090d16" rx="16"/>

  <!-- Step 1: Employer Task Creation -->
  <g transform="translate(40, 40)">
    <rect width="280" height="320" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5"/>
    <rect width="280" height="42" rx="12" fill="#1e293b"/>
    <text x="140" y="27" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle">1. Employer / Coordinator</text>

    <rect x="20" y="60" width="240" height="60" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="120" y="85" font-family="monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">createTask(taskHash, dur)</text>
    <text x="120" y="105" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">Deposits native / ERC20 bounty</text>

    <rect x="20" y="140" width="240" height="60" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="120" y="165" font-family="monospace" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">TaskCreated Event</text>
    <text x="120" y="185" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">Indexed emission on Kite Chain</text>

    <rect x="20" y="220" width="240" height="60" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="120" y="245" font-family="monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">assignAgent(taskId, agent)</text>
    <text x="120" y="265" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">Designates worker AI agent</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(330, 190)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="url(#flowGrad)" stroke-width="2.5" stroke-dasharray="4,4"/>
    <polygon points="65,0 55,-5 55,5" fill="#818cf8"/>
    <text x="30" y="-10" font-family="monospace" font-size="10" fill="#818cf8" text-anchor="middle">Assign</text>
  </g>

  <!-- Step 2: Agent Execution & Deliverable Submission -->
  <g transform="translate(410, 40)">
    <rect width="280" height="320" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5"/>
    <rect width="280" height="42" rx="12" fill="#1e293b"/>
    <text x="140" y="27" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#818cf8" text-anchor="middle">2. Autonomous Worker Agent</text>

    <rect x="20" y="60" width="240" height="60" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1.2"/>
    <text x="120" y="85" font-family="monospace" font-size="11" font-weight="600" fill="#818cf8" text-anchor="middle">Off-Chain Execution DAG</text>
    <text x="120" y="105" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">LLM reasoning &amp; data retrieval</text>

    <rect x="20" y="140" width="240" height="60" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="120" y="165" font-family="monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">submitDeliverable(hash)</text>
    <text x="120" y="185" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">Anchors output IPFS/digest</text>

    <rect x="20" y="220" width="240" height="60" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.2"/>
    <text x="120" y="245" font-family="monospace" font-size="11" font-weight="600" fill="#34d399" text-anchor="middle">Deadline Strict Enforcer</text>
    <text x="120" y="265" font-family="monospace" font-size="10" fill="#6ee7b7" text-anchor="middle">Block timestamp assertion</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g transform="translate(700, 190)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="url(#flowGrad)" stroke-width="2.5" stroke-dasharray="4,4"/>
    <polygon points="65,0 55,-5 55,5" fill="#10b981"/>
    <text x="30" y="-10" font-family="monospace" font-size="10" fill="#10b981" text-anchor="middle">Settlement</text>
  </g>

  <!-- Step 3: x402 Micropayment Settlement -->
  <g transform="translate(780, 40)">
    <rect width="280" height="320" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5"/>
    <rect width="280" height="42" rx="12" fill="#1e293b"/>
    <text x="140" y="27" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#10b981" text-anchor="middle">3. Kite Chain x402 Vault</text>

    <rect x="20" y="60" width="240" height="60" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="120" y="85" font-family="monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">completeTask(receiptHash)</text>
    <text x="120" y="105" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">Validates x402 payment proof</text>

    <rect x="20" y="140" width="240" height="60" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
    <text x="120" y="165" font-family="monospace" font-size="11" font-weight="600" fill="#10b981" text-anchor="middle">Zero-Loss Payout</text>
    <text x="120" y="185" font-family="monospace" font-size="10" fill="#6ee7b7" text-anchor="middle">Transfers locked bounty</text>

    <rect x="20" y="220" width="240" height="60" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="120" y="245" font-family="monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">claimRefund(taskId)</text>
    <text x="120" y="265" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">Post-deadline employer escrow refund</text>
  </g>
</svg>
